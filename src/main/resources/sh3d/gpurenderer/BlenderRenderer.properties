# Default rendering parameters of BlenderRenderer. Each one may be overridden with a System property
# prefixed by the class name, for example -Dsh3d.gpurenderer.BlenderRenderer.highQuality.samples=1024

# Maximum count of samples per pixel computed by Cycles before denoising
lowQuality.samples=64
highQuality.samples=256

# What the ceilings and levels hidden in the 3D view block without being seen by the camera, to view a floor
# from above lit as if the home was more complete: false for nothing, sun for the direct light of the sun
# only, all for all light, which leaves rooms without window nor lamp in the dark
lowQuality.hiddenItemsBlockLight=false
highQuality.hiddenItemsBlockLight=false

# Exposure of the image in stops, each one doubling its brightness and a negative value darkening it.
# The default suits views lit by the sky, a view from inside a room being closer to a photo around 2
lowQuality.exposure=0
highQuality.exposure=0
